services:
  postgres:
    image: postgres:16
    container_name: ewallet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ewallet}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - ewallet-pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: ewallet-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-this-is-a-strong-long-enough-jwt-secret-for-hmac-sha-256-1234567890}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/ewallet}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}

volumes:
  ewallet-pgdata:
